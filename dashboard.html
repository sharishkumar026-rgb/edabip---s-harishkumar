
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b14">
    <meta name="description" content="EDABIP enterprise analytics dashboard">

    <title>EDABIP | Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .dashboard-page {
            min-height: 100vh;
            padding: 32px;
            color: #f4f7ff;
            background:
                radial-gradient(circle at 10% 10%, rgba(92, 225, 230, .09), transparent 35%),
                radial-gradient(circle at 90% 90%, rgba(165, 139, 250, .10), transparent 35%),
                #070b14;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(164, 190, 226, .13);
        }

        .dashboard-brand {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: .04em;
        }

        .dashboard-brand span {
            color: #5ce1e6;
        }

        .dashboard-user {
            display: inline-block;
            margin-right: 16px;
            color: #b1bfd4;
            overflow-wrap: anywhere;
        }

        .dashboard-logout {
            padding: 10px 18px;
            color: #f4f7ff;
            background: #111c2d;
            border: 1px solid rgba(164, 190, 226, .2);
            border-radius: 10px;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease;
        }

        .dashboard-logout:hover {
            border-color: #5ce1e6;
            background: #17253a;
        }

        .dashboard-logout:focus-visible {
            outline: 2px solid #5ce1e6;
            outline-offset: 4px;
        }

        .dashboard-logout:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .dashboard-content {
            max-width: 1100px;
            margin: 70px auto 0;
        }

        .dashboard-eyebrow {
            color: #5ce1e6;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .dashboard-content h1 {
            margin: 14px 0;
            font-size: clamp(2rem, 5vw, 3.4rem);
        }

        .dashboard-description {
            max-width: 650px;
            color: #b1bfd4;
            line-height: 1.8;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 42px;
        }

        .dashboard-card {
            padding: 25px;
            background: rgba(13, 20, 34, .88);
            border: 1px solid rgba(164, 190, 226, .13);
            border-radius: 16px;
            transition: transform .2s ease, border-color .2s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-3px);
            border-color: rgba(92, 225, 230, .4);
        }

        .dashboard-card h2 {
            margin: 0 0 12px;
            font-size: 1.05rem;
        }

        .dashboard-card p {
            margin: 0;
            color: #b1bfd4;
            line-height: 1.7;
        }

        @media (max-width: 700px) {
            .dashboard-page {
                padding: 20px;
            }

            .dashboard-header {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .dashboard-header > div:last-child {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: 12px;
            }

            .dashboard-user {
                margin-right: 0;
            }

            .dashboard-content {
                margin-top: 42px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .dashboard-card,
            .dashboard-logout {
                transition: none;
            }

            .dashboard-card:hover {
                transform: none;
            }
        }
    </style>

    <script type="module" src="js/dashboard.js"></script>
</head>

<body>
    <main class="dashboard-page">
        <header class="dashboard-header">
            <div class="dashboard-brand" aria-label="EDABIP">
                EDA<span>BIP</span>
            </div>

            <div>
                <span class="dashboard-user" id="dashboardUser">
                    Loading user...
                </span>

                <button
                    class="dashboard-logout"
                    id="logoutButton"
                    type="button"
                >
                    Log out
                </button>
            </div>
        </header>

        <section
            class="dashboard-content"
            aria-labelledby="dashboardTitle"
        >
            <p class="dashboard-eyebrow">
                Enterprise intelligence platform
            </p>

            <h1 id="dashboardTitle">Welcome to EDABIP</h1>

            <p class="dashboard-description" id="dashboardWelcome">
                Your analytics workspace is ready.
            </p>

            <div class="dashboard-grid">
                <article class="dashboard-card">
                    <h2>Analytics</h2>
                    <p>
                        Explore business performance and data insights.
                    </p>
                </article>

                <article class="dashboard-card">
                    <h2>Reports</h2>
                    <p>
                        Review reporting tools and business summaries.
                    </p>
                </article>

                <article class="dashboard-card">
                    <h2>Settings</h2>
                    <p>
                        Manage your workspace preferences.
                    </p>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
